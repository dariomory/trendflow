[project]
site_name = "Trendflow"
site_url = "https://dariomory.github.io/trendflow/"
repo_url = "https://github.com/dariomory/trendflow"
repo_name = "dariomory/trendflow"
nav = [
  { "Home" = "index.md" },
  { "API Reference" = "api.md" },
  { "Architecture" = "architecture.md" },
]

# The guides live in `guides/` rather than `docs/` on purpose. trendflow.mory.dev renders
# those very files straight from this repo as the canonical documentation; building them here
# too would put identical prose on two domains and split the ranking. This site publishes only
# what is unique to it — the API reference generated from docstrings.

[project.theme]
logo = "logo.png"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
